<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Photo Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    color: #222;
    padding: 40px 20px;
  }
  header {
    text-align: center;
    margin-bottom: 50px;
  }
  header h1 {
    font-weight: 300;
    font-size: 2.2rem;
    letter-spacing: 1px;
  }
  header p {
    color: #888;
    margin-top: 8px;
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .photo-card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
  }
  .photo-card p {
    margin-top: 10px;
    font-size: 0.9rem;
    color: #555;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Our Photo Diary</h1>
  <p>just us, moments worth keeping</p>
</header>

<div class="grid">

  <div class="photo-card">
    <img src="https://via.placeholder.com/600x400" alt="photo">
    <p>Your caption here</p>
  </div>

  <div class="photo-card">
    <img src="https://via.placeholder.com/600x400" alt="photo">
    <p>Your caption here</p>
  </div>

  <div class="photo-card">
    <img src="https://via.placeholder.com/600x400" alt="photo">
    <p>Your caption here</p>
  </div>

</div>

</body>
</html>
